name: osv-scan

# Weekly dependency drift check for `less`.
#
# The merge gate lives in less-ci.yml (`osv` job). This one exists because advisories are
# published *after* a merge: without a scheduled run, a lockfile that was clean last week can
# quietly become vulnerable and nobody would know until the next PR.
#
# Same ratchet script, so the accepted set comes from config/quality/osv-baseline.json and only
# NEW advisories fail the run. `npm audit` is not usable here (the npm registry in use answers
# [NOT_IMPLEMENTED] for the advisories endpoint), which is why the script queries api.osv.dev
# directly with the lockfile, the same data osv-scanner uses.
on:
  schedule:
    - cron: "0 3 * * 2" # weekly, Tuesday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osv-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    name: osv-ratchet (package-lock.json)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - run: node scripts/quality/osv-ratchet.mjs
      - name: Summary
        if: always()
        run: |
          echo "Advisory baseline: \`config/quality/osv-baseline.json\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Refresh after fixing or accepting findings: \`node scripts/quality/osv-ratchet.mjs --update\`" >> "$GITHUB_STEP_SUMMARY"
