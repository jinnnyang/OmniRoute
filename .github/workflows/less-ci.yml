name: less-ci

# Fork CI gate for the `less` branch (jinnnyang/OmniRoute).
# Why this file exists: the vendored upstream workflows all bind to `main` /
# `release/**`, branches this fork does not use, so `less` had exactly one job
# (Build App) and pull requests into `less` ran nothing at all.
#
# Scope of this first iteration (T0):
#   lint      — eslint
#   unit      — node:test suite, 4 shards
#   build     — production build in the mode we actually ship (webpack)
#   image     — docker build + run + prove the container boots with the native driver
#   gate      — single required status check for branch protection

on:
  pull_request:
    branches: ["less"]
  push:
    branches: ["less"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: less-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit:
    name: unit (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      # The `less` baseline ships ~158 known-failing tests (environment-dependent
      # catalogs, OAuth routes, docs-drift checks). A red gate nobody reads is worse
      # than no gate, and a non-blocking job is the SKIP-green pattern this fork's
      # review calls out — so the job runs everything and a ratchet step fails only
      # on failures that are NOT in config/quality/unit-known-failures.json.
      - name: Run unit tests (shard ${{ matrix.shard }}) with one retry on new failures
        shell: bash
        env:
          TEST_SHARD: ${{ matrix.shard }}
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          run_shard() {
            set +e
            npm run test:unit:ci:shard 2>&1 | tee unit.log
            local code=${PIPESTATUS[0]}
            set -e
            node scripts/quality/unit-ratchet.mjs unit.log --exit-code "$code"
          }
          # A handful of the baseline failures are network-dependent (firecrawl creds,
          # provider catalogs) and flip between runs. One retry separates a flake from a
          # regression without weakening the ratchet: a genuine new failure fails twice.
          # One retry only. The two environment-dependent tests that used to flip
          # between runs (search-route firecrawl, visionBridge callVisionModel) are
          # now hermetic, so a second failure is almost always real. A retry still
          # absorbs genuine runner hiccups (DNS, package fetch).
          for attempt in 1 2; do
            if run_shard; then
              exit 0
            fi
            echo "::warning::unit shard ${{ matrix.shard }} attempt ${attempt}/2 reported new failures"
          done
          exit 1

  build:
    name: build (webpack)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - name: Production build (webpack, the shipping mode)
        env:
          NODE_OPTIONS: "--max-old-space-size=12288"
          OMNIROUTE_BUILD_MEMORY_MB: "12288"
          OMNIROUTE_USE_TURBOPACK: "0"
          OMNIROUTE_BUILD_SHA: ${{ github.sha }}
        run: npm run build:release

  image:
    name: docker-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Expand swap (image build is memory hungry)
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 8G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=8192
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Build image
        run: |
          docker build \
            --build-arg BUILD_SHA="${GITHUB_SHA}" \
            -t omniroute:ci .

      - name: Run container
        run: |
          docker run -d --name omniroute-ci \
            -p 127.0.0.1:20128:20128 \
            -e DATA_DIR=/app/data \
            omniroute:ci

      - name: Wait for health and assert boot invariants
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:20128/api/monitoring/health -o /tmp/health.json 2>/dev/null; then
              break
            fi
            sleep 3
          done
          echo "health: $(cat /tmp/health.json 2>/dev/null || echo '<none>')"
          grep -q '"status":"healthy"' /tmp/health.json
          # 17 篇 (2026-09): a silent fallback to the sql.js WASM driver ran the
          # gateway 2-4 days then exhausted the heap. Assert the native driver.
          docker logs omniroute-ci 2>&1 | tee /tmp/boot.log | tail -50
          grep -q '\[DB\] Driver: better-sqlite3' /tmp/boot.log
          # T0-5: image must know which commit it was built from.
          test "$(docker exec omniroute-ci printenv OMNIROUTE_BUILD_SHA)" = "${GITHUB_SHA}"

      - name: Container logs on failure
        if: failure()
        run: docker logs omniroute-ci || true

  guards:
    name: incident-guards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      # These are the T2 preconditions from reviews/20261116-less/code-arch.md.
      # Green assertions lock in today's (broken) behaviour; `todo` tests carry the
      # acceptance criteria and start passing when the fix lands.
      - run: npm run test:incident-guards

  gate:
    name: Gate / less-ci
    if: always()
    needs: [lint, unit, build, image, guards]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every required job succeeded
        run: |
          echo "lint=${{ needs.lint.result }} unit=${{ needs.unit.result }} build=${{ needs.build.result }} image=${{ needs.image.result }}"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.unit.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.guards.result }}" = "success"
          test "${{ needs.image.result }}" = "success"
